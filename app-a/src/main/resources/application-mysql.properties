server.port=18080

spring.datasource.url=jdbc:mysql://localhost:3306/cxfdemo1?useUnicode=true&characterEncoding=utf8&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Taipei
spring.datasource.username=${MYSQL_USERNAME:root}
spring.datasource.password=${MYSQL_PASSWORD:123456}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

sharedservices.jndi.datasources.cxfdemo1.driver-class-name=com.mysql.cj.jdbc.Driver
sharedservices.jndi.datasources.cxfdemo1.jdbc-url=${spring.datasource.url}
sharedservices.jndi.datasources.cxfdemo1.username=${spring.datasource.username}
sharedservices.jndi.datasources.cxfdemo1.password=${spring.datasource.password}

